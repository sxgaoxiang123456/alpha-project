<!DOCTYPE html>
<html class="dark" lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NL Alert Input Visual Fixture</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "background": "#11131c",
                        "surface": "#11131c",
                        "surface-dim": "#11131c",
                        "surface-bright": "#373943",
                        "surface-container-lowest": "#0c0e17",
                        "surface-container-low": "#191b25",
                        "surface-container": "#1d1f29",
                        "surface-container-high": "#282934",
                        "surface-container-highest": "#32343f",
                        "surface-base": "#0F172A",
                        "surface-raised": "#1E293B",
                        "surface-lowest": "#020617",
                        "surface-variant": "#32343f",
                        "on-surface": "#e1e1ef",
                        "on-surface-variant": "#c3c5d9",
                        "inverse-surface": "#e1e1ef",
                        "inverse-on-surface": "#2e303a",
                        "outline": "#8d90a2",
                        "outline-variant": "#434656",
                        "primary": "#b7c4ff",
                        "on-primary": "#002682",
                        "primary-container": "#0052ff",
                        "on-primary-container": "#dfe3ff",
                        "inverse-primary": "#004ced",
                        "secondary": "#b7c8e1",
                        "on-secondary": "#233044",
                        "secondary-container": "#3a4b62",
                        "on-secondary-container": "#d6e3fa",
                        "tertiary": "#efb8ff",
                        "on-tertiary": "#4a155c",
                        "tertiary-container": "#633078",
                        "on-tertiary-container": "#f8d8ff",
                        "error": "#ffb4ab",
                        "on-error": "#690005",
                        "error-container": "#93000a",
                        "on-error-container": "#ffdad6",
                        "market-up": "#ff4d4f",
                        "market-down": "#4ade80",
                        "market-warning": "#f59e0b",
                    },
                    fontFamily: {
                        'headline-md': ['"Hanken Grotesk"', 'sans-serif'],
                        'body-md': ['Inter', 'sans-serif'],
                        'data-table': ['"JetBrains Mono"', 'monospace'],
                        'label-caps': ['Inter', 'sans-serif'],
                    },
                    fontSize: {
                        'headline-md': ['16px', { lineHeight: '24px', fontWeight: '500' }],
                        'body-md': ['14px', { lineHeight: '20px', fontWeight: '400' }],
                        'data-table': ['12px', { lineHeight: '16px', fontWeight: '400' }],
                        'label-caps': ['11px', { lineHeight: '16px', fontWeight: '500', letterSpacing: '0.5px' }],
                    },
                }
            }
        };
    </script>
    <style>
        body { background-color: #11131c; padding: 24px; }
    </style>
</head>
<body>
    <div class="max-w-[1280px] mx-auto">
        <div class="nl-alert-input-component mb-6" data-submit-url="/api/alerts/natural-language">
            <div class="flex gap-3">
                <input
                    type="text"
                    class="nl-alert-input flex-1 bg-surface-raised border border-outline-variant rounded py-2.5 px-4 font-body-md text-body-md text-on-surface placeholder-on-surface-variant focus:border-primary-container focus:outline-none transition-colors"
                    placeholder="例如：茅台跌破 1500 提醒我"
                    maxlength="200"
                    autocomplete="off"
                >
                <button
                    class="nl-alert-submit flex items-center gap-2 bg-primary-container text-on-primary-container hover:bg-primary hover:text-on-primary rounded px-5 py-2.5 font-headline-md text-headline-md transition-colors"
                    type="button"
                >
                    <span class="material-symbols-outlined text-[18px]">add_alert</span>
                    创建预警
                </button>
            </div>
            <div class="nl-alert-result mt-3 hidden font-body-md text-body-md"></div>
            <div class="nl-alert-candidates mt-3 hidden space-y-2"></div>
        </div>
    </div>
    <script type="module">
        import { initNLAlertInput } from '/static/js/nl_alert_input.js';
        initNLAlertInput(document.querySelector('.nl-alert-input-component'));
    </script>
</body>
</html>
